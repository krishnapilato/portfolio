name: Backend

on:
  push:
    branches:
      - main
    paths:
      - backend/**
      - .github/workflows/backend.yml
  pull_request:
    paths:
      - backend/**
      - .github/workflows/backend.yml
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 27
        uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: '27'
          cache: gradle

      - name: Build, test and enforce quality gates
        run: sh ./gradlew build

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/**/build/reports/jacoco/test/html
          if-no-files-found: ignore

  updates:
    name: Updates applied
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 27
        uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: '27'
          cache: gradle

      - name: Fail when a newer stable release exists
        run: sh ./gradlew dependencyUpdates

  mutation:
    name: Mutation testing (${{ matrix.module }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        module: [ core, services:mail, services:notification, services:seed ]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 27
        uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: '27'
          cache: gradle

      - name: Run PIT and enforce the mutation score
        run: sh ./gradlew :${{ matrix.module }}:mutationTest

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-report-${{ strategy.job-index }}
          path: backend/**/build/reports/pitest
          if-no-files-found: ignore

  image:
    name: Image (${{ matrix.service }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [ mail, notification, seed ]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/services/${{ matrix.service }}/Dockerfile
          push: false
          tags: ${{ matrix.service }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
