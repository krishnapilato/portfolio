# Local stack: MySQL, Mailpit (an SMTP server with a web inbox, so no real email is sent) and the app.
# Every port is bound to 127.0.0.1, so none of them is reachable from the network.
name: portfolio

services:
  mysql:
    image: mysql:26.7
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_DATABASE: portfolio
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent" ]
      interval: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "127.0.0.1:8025:8025" # web inbox
      - "127.0.0.1:1025:1025" # SMTP

  app:
    build: .
    env_file: .env
    environment:
      DB_URL: jdbc:mysql://mysql:3306/portfolio
      DB_USERNAME: root
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_STARTTLS: "false"
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  mysql-data:
