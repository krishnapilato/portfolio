spring:
  application:
    name: portfolio
  config:
    import: optional:file:${DOTENV_FILE:.env}[.properties]
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  main:
    keep-alive: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: portfolio-db
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:5000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_updates: true
        default_batch_fetch_size: 32
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: ${MAIL_STARTTLS:false}
  mvc:
    apiversion:
      supported: 1
      required: false
  data:
    web:
      pageable:
        serialization-mode: via-dto
        max-page-size: 100
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB
  web:
    error:
      include-message: always
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
      roles: ADMIN
      group:
        readiness:
          include: readinessState,db
    env:
      show-values: never
      roles: ADMIN
    configprops:
      show-values: never
      roles: ADMIN
  info:
    java:
      enabled: true
    os:
      enabled: true
    process:
      enabled: true
    env:
      enabled: true
  health:
    mail:
      enabled: false
  httpexchanges:
    recording:
      include: time-taken,request-headers,response-headers,principal,remote-address
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
info:
  app:
    name: Portfolio Platform
    description: Authentication, user management and transactional email for krishnapilato.github.io
    java: ${java.specification.version}
logging:
  pattern:
    correlation: "[%X{requestId:-}] "
app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173/portfolio}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    secret: ${APP_SECRET}
    issuer: ${APP_JWT_ISSUER:portfolio}
    scrape-password: ${APP_SCRAPE_PASSWORD:}
  mail:
    from: ${MAIL_FROM}
    poll-interval: ${MAIL_POLL_INTERVAL:PT5S}
  seed:
    enabled: ${SEED_ENABLED:false}
  dashboard:
    pulse-interval: PT3S
springdoc:
  swagger-ui:
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    enabled: true
---
spring:
  config:
    activate:
      on-profile: dev
  thymeleaf:
    cache: false
management:
  endpoint:
    heapdump:
      access: read-only
    env:
      show-values: when-authorized
    configprops:
      show-values: when-authorized
logging:
  level:
    com.personal.portfolio: DEBUG
---
spring:
  config:
    activate:
      on-profile: prod
  web:
    resources:
      chain:
        strategy:
          content:
            enabled: true
      cache:
        cachecontrol:
          max-age: 365d
          cache-public: true
logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}
        environment: prod
management:
  info:
    os:
      enabled: false
    process:
      enabled: false
