spring:
  application:
    name: portfolio
  config:
    # Secrets live in a git-ignored .env file; real environment variables override it.
    import: optional:file:${DOTENV_FILE:.env}[.properties]
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  main:
    keep-alive: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: portfolio-db
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:5000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway owns the schema; Hibernate only checks that the entities match it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_updates: true
        default_batch_fetch_size: 32
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: ${MAIL_STARTTLS:false}
            required: ${MAIL_STARTTLS:false} # once TLS is on, never fall back to plain text
          ssl:
            checkserveridentity: true
  jackson:
    factory:
      constraints:
        read:
          max-document-length: 1000000 # no real request comes close to 1 MB of JSON
          max-string-length: 200000
  mvc:
    apiversion:
      supported: 1
      required: false
  data:
    web:
      pageable:
        serialization-mode: via-dto
        max-page-size: 100
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB
server:
  port: ${PORT:8080}
  # X-Forwarded-* headers count only when they come from a proxy matching TRUSTED_PROXIES (a regex).
  # The default trusts no one, so a client cannot fake its address to slip past the sign-in rate limit.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: ${TRUSTED_PROXIES:}
  compression:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: "*" # every endpoint is exposed, but only health and info are public (see SecurityConfig)
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
      roles: ADMIN
      cache:
        time-to-live: 5s
      group:
        readiness:
          include: readinessState,db
    heapdump:
      access: none # a heap dump holds every secret in memory
    env:
      show-values: never
      roles: ADMIN
    configprops:
      show-values: never
      roles: ADMIN
  info:
    env:
      enabled: true
  health:
    mail:
      enabled: false # SMTP trouble shows up in the mail outbox health instead
  httpexchanges:
    recording:
      include: time-taken,request-headers,response-headers,principal,remote-address
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
info:
  app:
    name: Portfolio Platform
    description: "A Spring Boot base for new projects: accounts, sign-in and transactional email"
logging:
  pattern:
    correlation: "[%X{requestId:-}] "
app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    secret: ${APP_SECRET}
    issuer: ${APP_JWT_ISSUER:portfolio}
    scrape-password: ${APP_SCRAPE_PASSWORD:}
  mail:
    from: ${MAIL_FROM}
    poll-interval: ${MAIL_POLL_INTERVAL:PT5S}
  seed:
    enabled: ${SEED_ENABLED:false}
springdoc: # the API docs are public on purpose: they are part of what this service shows off
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
---
spring:
  config:
    activate:
      on-profile: dev
  thymeleaf:
    cache: false
logging:
  level:
    com.personal.portfolio: DEBUG
---
spring:
  config:
    activate:
      on-profile: prod
  mail:
    properties:
      mail:
        smtp:
          starttls:
            enable: ${MAIL_STARTTLS:true}
            required: ${MAIL_STARTTLS:true}
logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}
        environment: prod
