    <!-- Motion is allowed: mark it before the first paint, so text that will
         be set is hidden from the start and nothing flashes. If the script
         has not arrived within 3 s, the finished copy is shown instead. -->
    <script>
      (function (d) {
        if (matchMedia("(prefers-reduced-motion: no-preference)").matches) {
          d.classList.add("motion");
          window.__motionTimer = setTimeout(function () {
            d.classList.remove("motion");
            window.__motionTimedOut = true;
          }, 3000);
        }
      })(document.documentElement);
    </script>
