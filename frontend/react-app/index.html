<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Khova Krishna Pilato — Full Stack Java Developer</title>
    <meta
      name="description"
      content="Khova Krishna Pilato, Full Stack Java Developer in Pavia and Milan, Italy. Spring Boot, Angular and React across energy, automotive, banking, insurance, pharma and public transport. Passionate about aviation."
    />
    <meta name="author" content="Khova Krishna Pilato" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0d10" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Khova Krishna Pilato — Full Stack Java Developer" />
    <meta
      property="og:description"
      content="Born in Bangalore. Raised in Italy. Building in Java. A scroll-driven cinematic portfolio."
    />
    <meta property="og:url" content="https://krishnapilato.github.io/portfolio/" />
    <meta name="twitter:card" content="summary" />

    <link rel="preload" href="/portfolio/fonts/InstrumentSans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/portfolio/fonts/IBMPlexMono-400.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Painted before the bundle arrives, so there is never a flash of white. -->
    <style>
      html {
        background: #0b0d10;
        color: #eef1f4;
      }
      @font-face {
        font-family: "Instrument Sans";
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url("/portfolio/fonts/InstrumentSans-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "IBM Plex Mono";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("/portfolio/fonts/IBMPlexMono-400.woff2") format("woff2");
      }
      @font-face {
        font-family: "IBM Plex Mono";
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("/portfolio/fonts/IBMPlexMono-500.woff2") format("woff2");
      }
    </style>
  </head>
  <body>
    <!-- The first beat's words are written here at build time, so the page
         paints them before a byte of JavaScript runs; React then takes over
         the same markup. -->
    <div id="root"><!--first-beat--></div>
    <noscript>
      <!-- Replaced at build time with the full article (see vite.config.ts). -->
      <p style="padding: 3rem 1.5rem; font-family: system-ui, sans-serif">
        Khova Krishna Pilato — Full Stack Java Developer.
        <a href="mailto:krishnak.pilato@gmail.com">krishnak.pilato@gmail.com</a>
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
